<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#161d2e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8533"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="415" cy="225" r="250" fill="url(#glow)"/>

  <!-- faint dot texture -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="55" r="3"/><circle cx="745" cy="55" r="3"/>
    <circle cx="720" cy="405" r="3"/><circle cx="65" cy="405" r="3"/>
  </g>

  <!-- ── customers reached (left) ──────────────────────────────── -->
  <g>
    <circle cx="122" cy="140" r="24" fill="#2a3245" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="122" cy="133" r="8" fill="#7c86a0"/>
    <path d="M106 152 a16 11 0 0 1 32 0 Z" fill="#7c86a0"/>
    <path d="M152 145 C 210 155 235 175 292 190" fill="none" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 9" stroke-opacity="0.8"/>
  </g>
  <g>
    <circle cx="96" cy="232" r="24" fill="#2a3245" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="96" cy="225" r="8" fill="#7c86a0"/>
    <path d="M80 244 a16 11 0 0 1 32 0 Z" fill="#7c86a0"/>
    <path d="M126 232 L 292 228" fill="none" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 9" stroke-opacity="0.8"/>
  </g>
  <g>
    <circle cx="128" cy="326" r="24" fill="#2a3245" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="128" cy="319" r="8" fill="#7c86a0"/>
    <path d="M112 338 a16 11 0 0 1 32 0 Z" fill="#7c86a0"/>
    <path d="M158 320 C 215 305 240 285 292 268" fill="none" stroke="#ff6600" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 9" stroke-opacity="0.8"/>
  </g>

  <!-- ── phone checkout ────────────────────────────────────────── -->
  <rect x="300" y="35" width="230" height="380" rx="30" fill="#1c2230" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <rect x="314" y="49" width="202" height="352" rx="18" fill="#10151f"/>

  <!-- header: brand dot + name bar -->
  <circle cx="340" cy="82" r="11" fill="url(#orange)"/>
  <rect x="360" y="76" width="86" height="10" rx="5" fill="#39415a"/>

  <!-- cart items -->
  <rect x="332" y="112" width="104" height="9" rx="4.5" fill="#2f3850"/>
  <rect x="468" y="112" width="30" height="9" rx="4.5" fill="#39415a"/>
  <rect x="332" y="140" width="82" height="9" rx="4.5" fill="#2f3850"/>
  <rect x="468" y="140" width="30" height="9" rx="4.5" fill="#39415a"/>
  <line x1="332" y1="170" x2="498" y2="170" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- round-up prompt -->
  <rect x="328" y="186" width="174" height="90" rx="14" fill="#ff6600" fill-opacity="0.12" stroke="#ff6600" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M344 208 c0 -3.6 2.9 -5.8 5.8 -5.8 c1.8 0 3 0.9 4 2 c1 -1.1 2.2 -2 4 -2 c2.9 0 5.8 2.2 5.8 5.8 c0 4.9 -9.8 10.7 -9.8 10.7 c0 0 -9.8 -5.8 -9.8 -10.7 Z" fill="#ff6600"/>
  <rect x="372" y="203" width="78" height="8" rx="4" fill="#4a5570"/>
  <rect x="344" y="226" width="58" height="8" rx="4" fill="#39415a"/>
  <text x="344" y="262" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ff8533">+$0.50</text>
  <rect x="444" y="240" width="46" height="25" rx="12.5" fill="url(#orange)"/>
  <circle cx="478" cy="252.5" r="9.5" fill="#ffffff"/>

  <!-- total row -->
  <rect x="332" y="296" width="58" height="9" rx="4.5" fill="#2f3850"/>
  <rect x="462" y="296" width="36" height="9" rx="4.5" fill="#39415a"/>

  <!-- CTA button -->
  <rect x="328" y="330" width="174" height="46" rx="13" fill="url(#orange)"/>
  <path d="M389 349 c0 -3 2.4 -4.8 4.8 -4.8 c1.5 0 2.5 0.7 3.3 1.6 c0.8 -0.9 1.8 -1.6 3.3 -1.6 c2.4 0 4.8 1.8 4.8 4.8 c0 4 -8.1 8.9 -8.1 8.9 c0 0 -8.1 -4.9 -8.1 -8.9 Z" fill="#ffffff"/>
  <rect x="412" y="348" width="52" height="9" rx="4.5" fill="#ffffff"/>

  <!-- ── broadcast rays (top right) ────────────────────────────── -->
  <path d="M556 96 a44 44 0 0 1 30 -12" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M562 118 a68 68 0 0 1 46 -19" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M568 140 a92 92 0 0 1 62 -25" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- ── hearts drifting out (right) ───────────────────────────── -->
  <path d="M598 218 c0 -5 4 -8 8 -8 c2.5 0 4.2 1.2 5.5 2.7 c1.3 -1.5 3 -2.7 5.5 -2.7 c4 0 8 3 8 8 c0 6.8 -13.5 14.8 -13.5 14.8 c0 0 -13.5 -8 -13.5 -14.8 Z" fill="#ff6600"/>
  <path d="M655 296 c0 -3.8 3 -6.1 6.1 -6.1 c1.9 0 3.2 0.9 4.2 2 c1 -1.1 2.3 -2 4.2 -2 c3.1 0 6.1 2.3 6.1 6.1 c0 5.2 -10.3 11.3 -10.3 11.3 c0 0 -10.3 -6.1 -10.3 -11.3 Z" fill="#ff6600" fill-opacity="0.7"/>
  <path d="M612 358 c0 -2.9 2.3 -4.7 4.7 -4.7 c1.4 0 2.4 0.7 3.2 1.5 c0.8 -0.8 1.8 -1.5 3.2 -1.5 c2.4 0 4.7 1.8 4.7 4.7 c0 4 -7.9 8.7 -7.9 8.7 c0 0 -7.9 -4.7 -7.9 -8.7 Z" fill="#ff6600" fill-opacity="0.45"/>
  <path d="M700 180 l4 9.5 9.5 4 -9.5 4 -4 9.5 -4 -9.5 -9.5 -4 9.5 -4 Z" fill="#ff8533" fill-opacity="0.8"/>
</svg>
